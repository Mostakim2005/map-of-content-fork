name: Lint and Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "package-lock.json found; using npm ci"
            npm ci
          else
            echo "package-lock.json not found; bootstrapping with npm install"
            npm install --no-audit --no-fund
          fi

      - name: Check TypeScript and Svelte
        run: npm run check

      - name: Run ESLint
        run: npm run lint


      - name: Build plugin
        run: npm run build

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f main.js

          node - <<'NODE'
          const fs = require("fs");

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          if (!manifest.id) throw new Error("manifest.json is missing id");
          if (!manifest.version) throw new Error("manifest.json is missing version");

          console.log(`Plugin: ${manifest.name || manifest.id}`);
          console.log(`Version: ${manifest.version}`);
          console.log(`main.js: ${fs.statSync("main.js").size} bytes`);
          NODE

      - name: Upload generated lockfile
        if: matrix.node-version == '20.x' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 7
