name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify dependencies
        run: |
          npm ls svelte-check --depth=0
          test -x node_modules/.bin/svelte-check

      - name: Run regression tests
        run: npm test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
            reports/
            tests/dist/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload generated lockfile
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock-test
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 7
