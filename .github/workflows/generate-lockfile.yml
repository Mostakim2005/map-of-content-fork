name: Generate Fresh Package Lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Generate fresh package-lock.json
        run: |
          set -euo pipefail

          rm -f package-lock.json

          npm install --include=dev --package-lock-only=false --no-audit --no-fund

          test -f package-lock.json
          echo "Fresh package-lock.json generated successfully."

      - name: Verify development dependencies
        run: |
          set -euo pipefail

          npm ls svelte-check --depth=0
          test -x node_modules/.bin/svelte-check

          echo "svelte-check is installed correctly."

      - name: Upload generated package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: fresh-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
